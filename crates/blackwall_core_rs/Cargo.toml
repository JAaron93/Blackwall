[package]
name = "blackwall_core_rs"
version = "0.1.0"
edition = "2021"
description = "Native Rust performance acceleration extension for Blackwall Agentic Firewall"
license = "MIT OR Apache-2.0"

[lib]
name = "_core_rs"
crate-type = ["cdylib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py310"] }
regex = "1.10"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[package.metadata.maturin]
name = "blackwall._core_rs"


