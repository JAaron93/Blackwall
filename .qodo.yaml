# Qodo Configuration (.qodo.yaml)
# Translated from Macroscope Code Review Rules (.macroscope/review-agent.md & AGENTS.md)
# Enforces low-noise, high-precision automated reviews for Blackwall Security Suite.

qodo:
  # Global Reviewer Settings
  verbosity: "quiet"
  require_score_review: false
  enable_semantic_files_types: true

  # Compliance Checklist Reference
  compliance:
    custom_compliance_path: "pr_compliance_checklist.yaml"

  # GitHub App Automation Triggers
  github_app:
    # Automated commands when a PR is opened, reopened, or marked ready
    handle_pr_actions: ['opened', 'reopened', 'ready_for_review']
    pr_commands:
      - "/describe"
      - "/review"
      - "/compliance"

    # Automatically re-run reviews whenever new commits are pushed to an open PR
    handle_push_trigger: true
    push_commands:
      - "/review"

    # Disable automatic runs on Draft PRs to avoid noise while work is in progress
    feedback_on_draft_pr: false

  # PR Reviewer Tool Configuration
  pr_reviewer:
    auto_review: true
    auto_describe: true
    auto_improve: false
    require_score_review: false
    extra_instructions: |
      - Mandatory 100% GCP Vertex AI Mode: Flag any PR reintroducing Google AI Studio API key configurations (e.g. GEMINI_API_KEY, LLM_API_KEY) or free-tier rate limit fallbacks. Ensure google-genai clients instantiate with vertexai=True, require GCP_PROJECT, and run in paid tier mode.
      - Verify that Blackwall Core (`src/blackwall/core/` or top-level `src/blackwall/`) remains a lightweight single-host daemon and does not import ZeroMQ, NATS, or eBPF C headers.
      - Ensure all enterprise capabilities (eBPF probes, ZeroMQ threat mesh, ephemeral identity sidecars, micro-sandbox wrappers, forensic engine) are cleanly isolated under `src/blackwall/enterprise/`.
      - Verify that execution flow in `SyncResolver` strictly maintains the order: Rate Check -> ContextHygiene Sanitization -> Threat Signature Graph Check -> Codebase Memory MCP AST Query -> Conditional GTI Validation -> Score Aggregation -> Threshold Verdict.
      - Ensure environment variable readers in `src/blackwall/enterprise/identity/` replace sensitive credentials (`AWS_SECRET_ACCESS_KEY`, `KUBECONFIG`) with synthetic honey-tokens (`BW_SYNTHETIC_*`) and handle JIT token swaps via `hashicorp-vault-mcp`.
      - Verify `ForensicTriageEngine` supports primary Ollama open-weight LLM triage with automatic failover to `LightweightForensicParser` when GPU/Ollama is offline.
      - Ensure `LightweightForensicParser` AST inspection resolves fully qualified callee names (e.g. `os.system`, `subprocess.Popen`, `pickle.loads`) rather than bare attribute names to prevent false-positive threat classifications on benign modules like `json.loads` or `asyncio.run`.
      - Flag any PR adding or modifying feature code without corresponding unit or integration tests under `tests/`.
      - Confirm all end-to-end security behavior contracts pass via `pytest-bdd` scenarios in `tests/features/`.
      - Verify `sys.addaudithook` registrations in tests are scoped inside isolated test functions, and background processes clean up process groups via `os.killpg(os.getpgid(pid), signal.SIGTERM)`.
      - Flag any synthetic test credentials matching live cloud provider key formats (e.g. `AWS_KEY_<digits>`) to prevent secret scanner false positives.

  # PR Description Tool Configuration (/describe)
  pr_description:
    publish_labels: true
    add_original_user_description: true
    generate_ai_title: true
    extra_instructions: |
      - Group changes by Blackwall Product Tier (Blackwall Core vs. Blackwall Enterprise Mesh).
      - Highlight any changes affecting security guardrail resolvers, eBPF probes, or MCP adapters.

  # PR Code Suggestions Configuration (/improve)
  pr_code_suggestions:
    num_code_suggestions: 4
    commitable_code_suggestions: true
    extra_instructions: |
      - Focus code suggestions strictly on performance bottlenecks, thread safety, async coroutine safety, and security vulnerabilities.
      - Ensure suggestions strictly conform to Python 3.11+ async patterns and avoid introducing deprecated decorators like `@unittest_run_loop`.
