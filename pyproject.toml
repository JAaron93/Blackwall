[build-system]
requires = ["maturin>=1.7.0,<2.0.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/blackwall_core_rs/Cargo.toml"
python-source = "src"
module-name = "blackwall._core_rs"
features = ["pyo3/extension-module"]


[project]
name = "blackwall"
version = "0.1.0"
description = "Blackwall Agentic Firewall"
readme = "README.md"
requires-python = ">=3.11.0"
dependencies = [
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0",
    "watchdog>=4.0.0",
    "aiohttp>=3.9.0",
    "certifi>=2024.0.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-exporter-prometheus>=0.45b0,<0.46",
    "prometheus-client>=0.20.0",
    "google-genai>=0.1.0",
    "cryptography>=42.0.0",
    "PyJWT>=2.13.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "asyncpg>=0.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-bdd>=8.0.0,<9.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.3.0",
    "black>=24.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "maturin>=1.7.0"
]
evaluation = [
    "google-cloud-aiplatform>=1.60.0",
    "pandas>=2.0.0",
    "google-cloud-trace>=1.11.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "attribution: Attacker attribution BDD test scenarios",
    "extractor: Identity extractor BDD scenarios (Track 2A)",
    "reporter: Incident report generator BDD scenarios (Track 2B)",
    "guardrails: Security guardrail test scenarios",
    "zero_ambient_authority: Zero ambient authority test scenarios",
    "enterprise: Enterprise security mesh test scenarios",
    "advanced_threat_detection: Advanced threat detection test scenarios",
    "retrospective: Retrospective analysis and historical query test scenarios",
    "evaluation: Evaluation environment and containment test scenarios",
    "vertex_evaluation: Mark tests that run Vertex AI Evaluation Service tasks",
    "asyncio: Mark async tests to run with pytest-asyncio",
]


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
