[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blackwall"
version = "0.1.0"
description = "Blackwall Agentic Firewall"
readme = "README.md"
requires-python = ">=3.11.0"
dependencies = [
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0",
    "watchdog>=4.0.0",
    "aiohttp>=3.9.0",
    "certifi>=2024.0.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-exporter-prometheus>=0.45b0,<0.46",
    "prometheus-client>=0.20.0",
    "google-genai>=0.1.0",
    "cryptography>=42.0.0",
    "PyJWT>=2.13.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "asyncpg>=0.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-bdd>=8.0.0,<9.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.3.0",
    "black>=24.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0"
]
weave = [
    "weave>=0.50.0",
    "wandb>=0.16.0",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "attribution: Attacker attribution BDD test scenarios",
    "extractor: Identity extractor BDD scenarios (Track 2A)",
    "reporter: Incident report generator BDD scenarios (Track 2B)",
    "guardrails: Security guardrail test scenarios",
    "zero_ambient_authority: Zero ambient authority test scenarios",
    "enterprise: Enterprise security mesh test scenarios",
    "advanced_threat_detection: Advanced threat detection test scenarios",
    "retrospective: Retrospective analysis and historical query test scenarios",
    "asyncio: Mark async tests to run with pytest-asyncio",
    "weave: Mark evaluation tests that require Weights & Biases Weave tracing. Run selectively with: pytest -m weave. Auto-skipped at collection time when _weave_available() returns False (see tests/conftest.py). Conditions that enable Weave (checked in order): WEAVE_DISABLED=true disables entirely; WEAVE_OFFLINE=true enables local tracing without credentials; WANDB_API_KEY set enables cloud sync; ~/.netrc api.wandb.ai entry or ~/.config/wandb/settings api_key enables cloud sync via stored credentials. All paths also require the weave package to be importable (pip install -e '.[weave]').",
]


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
