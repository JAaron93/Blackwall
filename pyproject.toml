[build-system]
requires = ["maturin>=1.7.0,<2.0.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/blackwall_core_rs/Cargo.toml"
python-source = "src"
module-name = "blackwall._core_rs"
features = ["pyo3/extension-module"]


[project]
name = "blackwall"
version = "2.0.0"
description = "Blackwall Agentic Firewall"
readme = "README.md"
requires-python = ">=3.14.0"
dependencies = [
    "aiosqlite>=0.22.0",
    "pydantic>=2.11.0",
    "structlog>=26.1.0",
    "pyyaml>=6.0.2",
    "watchdog>=6.0.0",
    "aiohttp>=3.14.0",
    "certifi>=2026.7.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-exporter-prometheus>=0.45b0",
    "prometheus-client>=0.26.0",
    "google-genai>=2.23.0",
    "cryptography>=50.0.0",
    "PyJWT>=2.14.0",
    "python-dotenv>=1.2.0",
    "httpx>=0.28.0",
    "fastapi>=0.140.0",
    "uvicorn>=0.50.0",
    "asyncpg>=0.31.0",
    "rich>=15.0.0",
    "click>=8.1.0",
]

[project.scripts]
blackwall = "blackwall.cli:main"

[project.optional-dependencies]
enterprise = [
    "pyzmq>=25.0.0"
]
dev = [
    "pytest>=8.4.2,<9.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-bdd>=8.0.0,<9.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.16.8",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "maturin>=1.7.0",
    "pyzmq>=25.0.0",
    "marimo>=0.11.0",
    "pandas>=3.0.0",
    "plotly>=5.0.0",
]
evaluation = [
    "google-cloud-aiplatform>=1.60.0",
    "pandas>=3.0.0",
    "google-cloud-trace>=1.11.0",
    "opentelemetry-exporter-gcp-trace>=1.6.0",
]
eval = [
    "google-adk>=0.1.0",
    "google-cloud-aiplatform[evaluation]>=1.160.0",
    "pandas>=3.0.0",
    "tqdm>=4.66.0",
    "marimo>=0.11.0",
]




[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "attribution: Attacker attribution BDD test scenarios",
    "extractor: Identity extractor BDD scenarios (Track 2A)",
    "reporter: Incident report generator BDD scenarios (Track 2B)",
    "guardrails: Security guardrail test scenarios",
    "zero_ambient_authority: Zero ambient authority test scenarios",
    "enterprise: Enterprise security mesh test scenarios",
    "advanced_threat_detection: Advanced threat detection test scenarios",
    "retrospective: Retrospective analysis and historical query test scenarios",
    "evaluation: Evaluation environment and containment test scenarios",
    "vertex_evaluation: Mark tests that run Vertex AI Evaluation Service tasks",
    "gcp_eval: GCP evaluation pipeline tests (require ADC)",
    "asyncio: Mark async tests to run with pytest-asyncio",
    "gti_rate_limiting: GTI rate limiting BDD scenarios",
    "jit_credential_privilege: JIT credential privilege BDD scenarios",
    "codebase_memory_blast_radius: Codebase memory blast radius BDD scenarios",
    "profile_db: Profile DB test scenarios",
    "e2e_attribution: E2E attribution test scenarios",
    "lifecycle: Lifecycle test scenarios",
    "swarm_models: Agent swarm attribution data models BDD scenarios",
    "linguistic_attribution: Linguistic swarm attribution BDD scenarios",
    "covert_channel: Covert channel detection BDD scenarios",
    "swarm_bridge: Swarm attribution provider bridge BDD scenarios",
]


[tool.ruff]
line-length = 88
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true

[tool.uv]
prerelease = "allow"

